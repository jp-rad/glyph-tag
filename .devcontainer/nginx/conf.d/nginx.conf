upstream backend-odoo {
    server app:8069;
}

upstream backend-odoochat {
    server app:8072;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  localhost;

    # SSL configuration
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_protocols       TLSv1.3;

    # Increase max request size (default is 1m)
    client_max_body_size 100m;

    # Proxy timeouts
    proxy_read_timeout      600s;
    proxy_connect_timeout   600s;
    proxy_send_timeout      600s;

    # Forward client information to backend
    proxy_set_header    Host                $http_host;
    proxy_set_header    X-Forwarded-Host    $http_host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto   $scheme;

    proxy_redirect off;

    # =====================================================================
    # BEGIN development-only endpoints: /ca.crt, /oreore, /trustme
    #
    # NOTE: These endpoints are intended for development
    #       and not recommended for production use.
    # =====================================================================

    # Serve the development CA certificate at /ca.crt
    location = /ca.crt {
        alias /etc/nginx/ssl/ca.crt;

        types { application/x-x509-ca-cert crt; }
        default_type application/x-x509-ca-cert;

        add_header Content-Disposition "attachment; filename=dev-root-certificate.crt";
    }

    # Redirect /oreore to /ca.crt
    location = /oreore {
        return 302 /ca.crt;
    }

    # Redirect /trustme to /ca.crt
    location = /trustme {
        return 302 /ca.crt;
    }

    # =====================================================================
    # END development-only endpoints
    # =====================================================================

    # Websocket (Odoo 16.0+)
    location /websocket {
        proxy_pass http://backend-odoochat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Longpolling (Odoo < 16.0)
    location /longpolling {
        proxy_pass http://backend-odoochat;
    }

    # Main Odoo backend
    location / {
        proxy_pass http://backend-odoo;
    }

    # Error pages
    error_page  500 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    error_page  502  /502.html;
    location = /502.html {
        return 502 "<!DOCTYPE HTML PUBLIC \"-//IETF//DTD HTML 2.0//EN\">\n<html><head>\n<title>Odoo is not running</title>\n</head><body>\n<h1>502 Bad Gateway - Odoo is not running</h1>\n<p>Start odoo.</p>\n<hr>\n<address>LB Server at $host Port $server_port</address>\n</body></html>";
    }

    # Cache static assets for performance
    location ~* /web/static/ {
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://backend-odoo;
    }

    # Enable gzip compression
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
    gzip on;
}
